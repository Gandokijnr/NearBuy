version: '3.9'
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: nearbuy_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: nearbuy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
  web:
    build: .
    container_name: nearbuy_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/nearbuy}
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - .:/app
volumes:
  db_data:
